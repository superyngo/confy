[workspace]
members = ["crates/confy-core", "crates/confy-ffi", "crates/confy-tui", "crates/confy-tauri", "crates/tauri-plugin-confy-picker"]
resolver = "2"

[workspace.package]
version = "0.31.0"
edition = "2021"
authors = ["wen"]
license = "MIT"
repository = "https://github.com/superyngo/confy"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
taplo = "0.14"            # lossless rowan CST backend (comments as real nodes)
rowan = "=0.15.18"        # lossless hand-rolled JSON/JSONC CST (same version taplo uses)
tempfile = "3"
fuzzy-matcher = "0.3"
jsonschema = { version = "0.30", default-features = false }
regex = "1"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
confy-core = { path = "crates/confy-core" }

[profile.release]
# Speed, not size. This profile is what the *native* artifacts are built with
# (the `confy` TUI and the Tauri desktop app), where runtime performance is what
# users feel and a few hundred KB of binary is irrelevant. `opt-level = 'z'`
# used to apply here too, which cost native speed to shrink a binary nobody
# downloads over a slow link.
#
# Only the wasm bundle genuinely wants a small artifact, so `web/cf-build.sh`
# overrides this one setting via `CARGO_PROFILE_RELEASE_OPT_LEVEL=z` for the
# wasm-pack leg — the same env-var override idiom `.github/workflows/release.yml`
# already uses to relax this profile for the Windows builds.
opt-level = 3
lto = true
codegen-units = 1
strip = true
