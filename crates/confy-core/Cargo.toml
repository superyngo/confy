[package]
name = "confy-core"
description = "Headless core for confy: lossless CST model, mutations, and cross-format conversion (no UI, no terminal)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "confy_core"
path = "src/lib.rs"

# Dependency-free perf harness (audit 2026-08-29). `harness = false` because it
# is a plain `main()` with manual timing, not a libtest/criterion suite — this
# crate intentionally adds no dev-dependency for it.
[[bench]]
name = "perf"
harness = false

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
taplo.workspace = true
rowan.workspace = true
nucleo-matcher.workspace = true
jsonschema.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

# Display-cell padding for the shared `kind_label::align_options` column
# alignment — a translated option name is CJK, whose char count is not its
# terminal width. Pure, no fs, wasm-safe.
unicode-width = "0.2"

# `add_picker.rs`'s "seed the field with the current time" needs a clock;
# `std::time::SystemTime::now()` traps at runtime on `wasm32-unknown-unknown`
# (the target the web/touch/VS Code/Tauri UIs run this crate as), so that
# target reads the JS `Date.now()` clock instead. Native hosts (the TUI) are
# unaffected — this dependency isn't even compiled in for them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true

[dev-dependencies]
proptest = "1"
