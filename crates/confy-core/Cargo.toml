[package]
name = "confy-core"
description = "Headless core for confy: lossless CST model, mutations, and cross-format conversion (no UI, no terminal)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "confy_core"
path = "src/lib.rs"

# Dependency-free perf harness (audit 2026-08-29). `harness = false` because it
# is a plain `main()` with manual timing, not a libtest/criterion suite — this
# crate intentionally adds no dev-dependency for it.
[[bench]]
name = "perf"
harness = false

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
taplo.workspace = true
rowan.workspace = true
fuzzy-matcher.workspace = true
jsonschema.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest = "1"
