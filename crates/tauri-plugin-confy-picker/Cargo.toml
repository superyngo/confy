[package]
name = "tauri-plugin-confy-picker"
version = "0.1.0"
authors.workspace = true
description = "Tauri plugin: native file/folder picker for the confy desktop and mobile shells"
edition = "2021"
license.workspace = true
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-confy-picker"

[dependencies]
tauri = { version = "2" }
serde = "1.0"
thiserror.workspace = true

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
