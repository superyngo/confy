name: Publish VS Code Extension

# Dispatched by publish-gate.yml once a tagged app Release succeeds and a
# reviewer approves — the extension is versioned in lockstep with the app
# (editors/vscode/package.json bumped alongside Cargo.toml in each release
# commit), so it publishes off the same vX.Y.Z tag rather than its own
# vscode-v*.*.* tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "App release tag to check out and publish (e.g. v0.18.0)"
        required: true
      dry_run:
        description: "Build + package only, skip Marketplace/Open VSX publish"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: vscode-ext
          cache-on-failure: true

      - uses: cargo-bins/cargo-binstall@main
      - name: Install wasm-pack
        run: cargo binstall -y wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Builds crates/confy-ffi (wasm) + assembles web/dist.
      - name: Build web frontend
        run: bash web/cf-build.sh

      - name: Install extension deps
        working-directory: editors/vscode
        run: npm ci

      - name: Build extension
        working-directory: editors/vscode
        run: npm run build

      - name: Verify package.json version matches tag
        working-directory: editors/vscode
        run: |
          tag_version="${{ inputs.tag }}"
          tag_version="${tag_version#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${{ inputs.tag }} does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Package .vsix
        working-directory: editors/vscode
        run: npx vsce package -o confy-vscode.vsix

      - uses: actions/upload-artifact@v5
        with:
          name: confy-vscode-vsix
          path: editors/vscode/confy-vscode.vsix

      - name: Publish to VS Marketplace
        if: ${{ inputs.dry_run != true }}
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath confy-vscode.vsix

      - name: Publish to Open VSX
        if: ${{ inputs.dry_run != true }}
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish confy-vscode.vsix -p "$OVSX_PAT"

      - name: Sync RELEASES.md — VS Code extension version
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout main
          bash scripts/sync-releases-md.sh "VS Code extension" "${{ inputs.tag }}"
